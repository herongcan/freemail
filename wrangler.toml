name = "freemail"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars = false

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail_free_db"
database_id = "316a5722-8d44-4f03-8f87-c796de19e9ca"

# 环境变量
# 敏感项 ADMIN_PASSWORD / JWT_TOKEN 请在 Cloudflare 后台设为 Secret，不要写入本文件
[vars]
MAIL_DOMAIN = "herongcan.icu"
ADMIN_NAME = "admin"
SESSION_EXPIRE_DAYS = "365"

# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"

# 说明：本部署未启用 R2（账号未开通 R2 计费）。
# 代码对 R2 缺失已做容错，收信与验证码提取正常；
# 影响：仅保留前 120 字正文预览，无法下载完整 .eml。
# # R2 存储桶绑定（用于保存完整 EML 内容）
# [[r2_buckets]]
# binding = "MAIL_EML"
# bucket_name = "mail-eml"
